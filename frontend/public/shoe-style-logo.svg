<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 190" width="854" height="190" role="img" aria-labelledby="title description">
  <title id="title">Shoe Style wordmark</title>
  <desc id="description">Red Shoe Style lettering on a transparent background, without a heel graphic.</desc>
  <defs>
    <linearGradient id="wordmark-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff241d"/><stop offset="0.52" stop-color="#e60000"/><stop offset="1" stop-color="#a90000"/></linearGradient>
    <filter id="wordmark-shadow" x="-3%" y="-8%" width="106%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="1.8" flood-color="#220000" flood-opacity="0.72"/></filter>
  </defs>
  <text x="427" y="151" text-anchor="middle" fill="url(#wordmark-red)" stroke="#640000" stroke-width="1.4" paint-order="stroke fill" filter="url(#wordmark-shadow)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="145" font-weight="900" letter-spacing="-8">Shoe Style</text>
</svg>
