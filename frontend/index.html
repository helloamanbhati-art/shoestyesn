  <style>
    html, body {

    }

    #root {
      height: 100%;
    }

    .storefront-boot {
      min-height: 100vh;
      padding: 20px 0 0;
      font-family: Arial, sans-serif;
      color: #171717;
    }

    .storefront-boot-header {
      display: flex;
      height: 72px;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #eee;
    }

    .storefront-boot-header img {
      width: 150px;
      height: auto;
    }

    .storefront-boot-hero {
      display: block;
      width: min(100%, 1760px);
      margin: 0 auto;
    }

    .storefront-boot-hero img {
      display: block;
      width: 100%;
      height: min(67vw, 650px);
      min-height: 360px;
      object-fit: cover;
    }

    @media (max-width: 767px) {
      .storefront-boot { padding-top: 0; }
      .storefront-boot-header { height: 68px; }
      .storefront-boot-hero img { height: auto; min-height: 0; aspect-ratio: 395 / 366; }
    }
  </style>
